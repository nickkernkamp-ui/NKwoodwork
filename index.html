<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="NK Woodwork creates custom handmade wood furniture, live-edge pieces, benches, tables, stools, boxes, and wood goods.">
    <title>NK Woodwork | Custom Wood Furniture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="NK Woodwork home">
        <span class="brand-mark">NK</span>
        <span>Woodwork</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#portfolio">Portfolio</a>
      </nav>
    </header>

    <main>
      <section id="home" class="hero">
        <img class="hero-image" src="assets/images/live-edge-bench-side.jpg" alt="Wood bench on a tile patio">
        <div class="hero-shade"></div>
      </section>

      <section id="portfolio" class="portfolio-section">
        <div class="section-title">
          <h2>Portfolio</h2>
        </div>

        <div class="portfolio-grid" aria-label="NK Woodwork image portfolio">
          <button class="portfolio-item" type="button" data-full="assets/images/wood-sculpture-lawn.jpg" data-title="Wood sculpture">
            <img src="assets/images/wood-sculpture-lawn.jpg" alt="Polished wood sculpture on a white table outdoors">
          </button>
          <button class="portfolio-item" type="button" data-full="assets/images/live-edge-bench-side.jpg" data-title="Live-edge bench">
            <img src="assets/images/live-edge-bench-side.jpg" alt="Live-edge bench on tile patio">
          </button>
          <button class="portfolio-item wide" type="button" data-full="assets/images/live-edge-table-garden.jpg" data-title="Garden table">
            <img src="assets/images/live-edge-table-garden.jpg" alt="Live-edge wood table in a garden">
          </button>
          <button class="portfolio-item" type="button" data-full="assets/images/live-edge-bench-angle.jpg" data-title="Wood bench">
            <img src="assets/images/live-edge-bench-angle.jpg" alt="Wood bench from an angled view">
          </button>
          <button class="portfolio-item" type="button" data-full="assets/images/courtyard-bench.jpg" data-title="Courtyard bench">
            <img src="assets/images/courtyard-bench.jpg" alt="Wood bench in front of tilework">
          </button>
          <button class="portfolio-item" type="button" data-full="assets/images/hero-bench.jpg" data-title="Live-edge bench">
            <img src="assets/images/hero-bench.jpg" alt="Live-edge wood bench on a patio">
          </button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>NK Woodwork</span>
    </footer>

    <dialog class="lightbox" aria-label="Project image preview">
      <button class="lightbox-close" type="button" aria-label="Close preview">×</button>
      <img src="assets/images/hero-bench.jpg" alt="">
      <p></p>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
